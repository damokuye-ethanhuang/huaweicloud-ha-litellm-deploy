{{/*
Renders the complete LiteLLM config as ONE document.

Why one document: LiteLLM's loader reads a single YAML document, so appending a
second one is silently ignored (verified by booting 1.106.3 against this
config). The static settings therefore live as values (config.settings) and the
model list is generated from values.models.

Timeout semantics (LiteLLM docs):
  request_timeout  = end-to-end budget for a request; on streamed
                     /v1/responses and /v1/messages it bounds each wait for the
                     next chunk. Default 600s, set to 1500s here.
  stream_timeout   = timeout for a streaming request; set equal to the
                     end-to-end budget so a slow stream is not cut early.

models[]  -> model_list
fallbacks -> router_settings.fallbacks (mutual rollback pairs)
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "litellm.configMapName" . }}
  labels:
    {{- include "litellm.labels" . | nindent 4 }}
data:
  config.yaml: |-
    # Generated by the chart. Settings come from values.config.settings,
    # model_list from values.models.

    {{- if not .Values.models }}
    # Phase 2: no models yet. An explicit [] (not an empty key, which YAML reads
    # as null) keeps the proxy bootable and makes /v1/models an honest signal:
    # 200 + [] means "control plane up, model layer not loaded".
    model_list: []
    {{- end }}
    {{- if .Values.models }}
    model_list:
    {{- range .Values.models }}
      {{- /* The prefix is added once: accept both "glm-5.3" and "openai/glm-5.3"
             (the documented form in models.yaml), never "openai/openai/...". */}}
      {{- $model := .model }}
      {{- if not (contains "/" $model) }}
      {{- $model = printf "openai/%s" $model }}
      {{- end }}
      - model_name: {{ .name | quote }}
        litellm_params:
          model: {{ $model | quote }}
          api_key: {{ printf "os.environ/%s" (.api_key_env | default "MODEL_API_KEY") | quote }}
          {{- if .api_base }}
          api_base: {{ .api_base | quote }}
          {{- end }}
          timeout: {{ $.Values.config.settings.requestTimeoutSeconds | default 1500 }}
          stream_timeout: {{ $.Values.config.settings.streamTimeoutSeconds | default 1500 }}
          {{- if $.Values.config.settings.maxParallelRequests }}
          max_parallel_requests: {{ $.Values.config.settings.maxParallelRequests }}
          {{- end }}
        model_info:
          mode: {{ .mode | default "chat" | quote }}
          {{- if .max_tokens }}
          max_tokens: {{ .max_tokens }}
          {{- end }}
        {{- if .rpm }}
        rpm: {{ .rpm }}
        {{- end }}
        {{- if .tpm }}
        tpm: {{ .tpm }}
        {{- end }}
    {{- end }}
    {{- end }}

    router_settings:
      routing_strategy: {{ .Values.config.settings.routingStrategy | default "simple-shuffle" }}
      num_retries: {{ .Values.config.settings.numRetries | default 2 }}
      timeout: {{ .Values.config.settings.requestTimeoutSeconds | default 1500 }}
      stream_timeout: {{ .Values.config.settings.streamTimeoutSeconds | default 1500 }}
      allowed_fails: {{ .Values.config.settings.allowedFails | default 2 }}
      cooldown_time: {{ .Values.fallbacks.cooldownSeconds | default 60 }}
      redis_host: os.environ/REDIS_HOST
      redis_port: os.environ/REDIS_PORT
      redis_password: os.environ/REDIS_PASSWORD
    {{- if .Values.fallbacks.enabled }}
      fallbacks:
    {{- range .Values.fallbacks.pairs }}
        {{- $pair := . }}
        {{- /* Every member of the pair falls back to the others: "mutual rollback"
               means both directions, not just the first entry. */}}
        {{- range $i, $target := $pair }}
        {{ $target | quote }}:
            {{- range $j, $other := $pair }}
              {{- if ne $i $j }}
          - {{ $other | quote }}
              {{- end }}
            {{- end }}
        {{- end }}
    {{- end }}
    {{- end }}

    litellm_settings:
      drop_params: true
      cache: true
      cache_params:
        type: redis
        host: os.environ/REDIS_HOST
        port: os.environ/REDIS_PORT
        password: os.environ/REDIS_PASSWORD
        ttl: {{ .Values.config.settings.cacheTtlSeconds | default 600 }}

    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
      database_url: os.environ/DATABASE_URL
      # false: models.yaml is the only source. With this true, a model added
      # in the Admin UI lands in the database and the two lists diverge
      # silently - the exact drift the three-phase flow exists to prevent.
      store_model_in_db: {{ .Values.config.settings.storeModelInDb | default false }}
      proxy_batch_write_at: {{ .Values.config.settings.spendBatchWriteSeconds | default 60 }}
      database_connection_pool_limit: {{ .Values.config.settings.dbConnectionPoolLimit | default 10 }}
      {{- if .Values.config.settings.maxParallelRequests }}
      global_max_parallel_requests: {{ .Values.config.settings.maxParallelRequests }}
      {{- end }}
      trusted_proxy_ranges:
    {{- range .Values.config.settings.trustedProxyRanges }}
        - {{ . | quote }}
    {{- end }}
