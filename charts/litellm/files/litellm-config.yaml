# LiteLLM proxy configuration
# Reference: https://docs.litellm.ai/docs/proxy/configs
#
# This file is the single source of truth. `make sync-config` copies it into
# charts/litellm/files/litellm-config.yaml; CI fails when the two drift apart.
#
# Model list is a bootstrap only: with STORE_MODEL_IN_DB=True the Admin UI is
# the source of truth after the first boot. Keep it small and idempotent.

model_list:
  # ModelArts / MaaS through its OpenAI-compatible endpoint. When the ModelArts
  # VPC endpoint is enabled, point MODELARTS_API_BASE at the private address.
  - model_name: maas-chat
    litellm_params:
      model: openai/DeepSeek-V4-Flash
      api_base: os.environ/MODELARTS_API_BASE
      api_key: os.environ/MODELARTS_API_KEY
    model_info:
      mode: chat

  # Remove the providers you do not use. Keys are read from the environment,
  # never written into the ConfigMap.
  - model_name: openai-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      mode: chat

router_settings:
  # simple-shuffle is the recommended strategy for throughput; the usage-based
  # strategies add Redis lookups to the request path.
  routing_strategy: simple-shuffle
  redis_host: os.environ/REDIS_HOST
  redis_port: os.environ/REDIS_PORT
  redis_password: os.environ/REDIS_PASSWORD
  num_retries: 2
  timeout: 600

litellm_settings:
  drop_params: true
  # Shared cache across gateway replicas.
  cache: true
  cache_params:
    type: redis
    host: os.environ/REDIS_HOST
    port: os.environ/REDIS_PORT
    password: os.environ/REDIS_PASSWORD
    ttl: 600
    # ssl: true   # enable together with dcs_ssl_enable = true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  # Manage models, teams and keys from the Admin UI instead of config reloads.
  store_model_in_db: true
  # Batch spend writes instead of writing on every request.
  proxy_batch_write_at: 60
  # Per-worker pool cap. Total connections = replicas x workers x limit, so keep
  # this in sync with the RDS max_connections ceiling.
  database_connection_pool_limit: 10
  # The ELB is the only hop in front of the gateway, so trust the VPC range.
  # Change this if your VPC uses a different CIDR.
  trusted_proxy_ranges:
    - 10.0.0.0/16
