name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: terraform + helm + scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          # Must match .terraform-version and versions.tf (>= 1.17.0).
          # 1.9.8 panics under -target with checkable objects, which is how
          # scripts/apply-staged.sh applies the stack.
          terraform_version: 1.17.0
          terraform_wrapper: false

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Install shellcheck, jq and python deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck jq python3-yaml

      - name: Cache Terraform providers
        run: mkdir -p "$RUNNER_TEMP/terraform-plugin-cache"

      - name: Validate
        run: make validate
        env:
          TF_PLUGIN_CACHE_DIR: ${{ runner.temp }}/terraform-plugin-cache
          TF_IN_AUTOMATION: "1"

  secrets-scan:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
